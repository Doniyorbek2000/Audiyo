# Teskari proksi: / → Next.js, /api → FastAPI (SSE uchun buferlash oʻchirilgan)
upstream api { server api:8000; }
upstream web { server frontend:3000; }

server {
    listen 80;
    server_name _;
    client_max_body_size 4g;          # katta video fayllar
    client_body_timeout 3600s;
    proxy_request_buffering off;      # yuklashni toʻgʻridan-toʻgʻri API ga oqim bilan uzatish

    location ~ ^/api/v1/(projects|books)/[^/]+/events {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding on;
    }

    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location /healthz { proxy_pass http://api; }

    location / {
        proxy_pass http://web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
